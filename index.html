<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Shift Ahoy</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0d1b2a;
        color: white;
        padding: 40px;
      }

      h1 {
        color: #5bc0be;
      }

      button {
        background: #5bc0be;
        color: black;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <h1>Shift Ahoy</h1>

    <p id="message">
      Welcome aboard, matey!
    </p>

    <button id="startButton">
      Start Shift Ahoy
    </button>

    <script>
      const button =
        document.getElementById("startButton");

      const message =
        document.getElementById("message");

      button.addEventListener("click", () => {
        message.textContent =
          "Ahoy! Shift Ahoy is working.";
      });
    </script>
  </body>
</html>
